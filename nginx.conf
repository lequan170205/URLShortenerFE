server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ DNS resolver cho proxy_pass (fix lỗi "no resolver defined")
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  resolver_timeout 5s;

  # ✅ Proxy các request API sang backend thật (qua Cloudflare)
  location ~ ^/(auth|url|admin)/ {
    proxy_pass https://api.url-shortener.site;   # KHÔNG thêm $request_uri
    proxy_ssl_server_name on;
    proxy_ssl_name api.url-shortener.site;

    proxy_set_header Host api.url-shortener.site;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
  }

  # ✅ CORS (nếu backend chưa bật)
  add_header 'Access-Control-Allow-Origin' '*' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # ✅ Vue Router SPA (history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ✅ Cache static assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|mp4)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  # ✅ gzip + bảo mật
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header X-XSS-Protection "1; mode=block";
}
